<div class="w-full bg-bg-surface border border-border p-5 rounded-xl shadow-xs flex flex-col gap-5">
  <h3
    class="text-sm font-black text-text-main border-b border-border pb-2.5 uppercase tracking-wider"
  >
    Resumen de Cobro
  </h3>

  <div class="flex flex-col gap-2 bg-bg-muted p-4 rounded-lg font-mono">
    <div class="flex justify-between text-xs text-text-muted">
      <span>Artículos totales:</span>
      <span class="font-bold text-text-main">{{ itemCount() }} u.</span>
    </div>
    <div class="flex justify-between items-baseline mt-2 pt-2 border-t border-border/60">
      <span class="text-xs font-bold text-text-main">Total Neto:</span>
      <span class="text-2xl font-black text-accent-ui">{{ total() | money: 'symbol' }}</span>
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <label class="field-label font-bold uppercase tracking-wide">Método de Liquidación</label>
    <div class="grid grid-cols-2 gap-3">
      <button
        type="button"
        (click)="onMethodChange(PaymentMethodEnum.Cash)"
        class="flex flex-col items-center gap-1 p-3 rounded-xl border text-xs font-bold transition-colors"
        [class.border-accent-ui]="currentMethod().value() === PaymentMethodEnum.Cash"
        [class.bg-bg-muted]="currentMethod().value() === PaymentMethodEnum.Cash"
        [class.text-accent-ui]="currentMethod().value() === PaymentMethodEnum.Cash"
        [class.border-border]="currentMethod().value() !== PaymentMethodEnum.Cash"
        [class.text-text-muted]="currentMethod().value() !== PaymentMethodEnum.Cash"
      >
        <span class="material-icons text-[24px]">payments</span>
        Efectivo
      </button>
      <button
        type="button"
        (click)="onMethodChange(PaymentMethodEnum.QrCode)"
        class="flex flex-col items-center gap-1 p-3 rounded-xl border text-xs font-bold transition-colors"
        [class.border-accent-ui]="currentMethod().value() === PaymentMethodEnum.QrCode"
        [class.bg-bg-muted]="currentMethod().value() === PaymentMethodEnum.QrCode"
        [class.text-accent-ui]="currentMethod().value() === PaymentMethodEnum.QrCode"
        [class.border-border]="currentMethod().value() !== PaymentMethodEnum.QrCode"
        [class.text-text-muted]="currentMethod().value() !== PaymentMethodEnum.QrCode"
      >
        <span class="material-icons text-[24px]">qr_code</span>
        Pago QR
      </button>
    </div>
  </div>

  @if (currentMethod().value() === PaymentMethodEnum.QrCode) {
    <div class="flex flex-col gap-1.5">
      <div class="flex justify-between items-center">
        <label class="field-label font-bold uppercase tracking-wide">Últimos 4 dígitos Tx</label>
        <span class="text-[10px] text-text-soft">(Opcional)</span>
      </div>
      <input
        type="text"
        inputmode="numeric"
        placeholder="Ej: 8492"
        class="w-full px-3 py-2 text-sm rounded-lg border border-border bg-bg-surface text-text-main font-mono focus:outline-none focus:border-border-strong"
        [formField]="$any(transactionCode)"
      />
    </div>
  }

  <button
    type="button"
    (click)="submitted.emit()"
    [disabled]="itemCount() === 0 || currentMethod().value() === null || submitting()"
    class="btn-primary w-full py-3 rounded-xl flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed"
  >
    <span class="material-icons text-[18px]">check_circle</span>
    Completar Compra
  </button>
</div>
