<div class="fixed inset-0 bg-overlay z-50 flex flex-col justify-end">
  <div class="flex-1" (click)="closed.emit()"></div>
  <div
    class="bg-bg-surface border-t border-border-strong rounded-t-2xl p-5 shadow-lg flex flex-col gap-4 max-h-[85vh] overflow-y-auto"
  >
    <div class="flex items-center justify-between pb-2 border-b border-border">
      <h3 class="text-base font-black text-text-main">Resumen y Método de Pago</h3>
      <button
        type="button"
        class="text-text-soft p-1 flex items-center justify-center"
        (click)="closed.emit()"
      >
        <span class="material-icons">close</span>
      </button>
    </div>

    <div class="flex justify-between items-center bg-bg-muted p-3 rounded-xl font-mono text-sm">
      <span class="text-text-muted">Total ({{ itemCount() }} art.)</span>
      <span class="text-lg font-black text-accent-ui">{{ total() | money: 'symbol' }}</span>
    </div>

    <div class="flex flex-col gap-2">
      <label class="field-label uppercase font-bold tracking-wide">Selecciona Método de Pago</label>
      <div class="grid grid-cols-2 gap-3">
        <button
          type="button"
          (click)="onMethodChange(PaymentMethodEnum.Cash)"
          class="flex flex-col items-center gap-1 p-3 rounded-xl border text-xs font-bold transition-colors"
          [class.border-accent-ui]="currentMethod().value() === PaymentMethodEnum.Cash"
          [class.bg-bg-muted]="currentMethod().value() === PaymentMethodEnum.Cash"
          [class.text-accent-ui]="currentMethod().value() === PaymentMethodEnum.Cash"
          [class.border-border]="currentMethod().value() !== PaymentMethodEnum.Cash"
          [class.text-text-muted]="currentMethod().value() !== PaymentMethodEnum.Cash"
        >
          <span class="material-icons text-[24px]">payments</span>
          Efectivo
        </button>
        <button
          type="button"
          (click)="onMethodChange(PaymentMethodEnum.QrCode)"
          class="flex flex-col items-center gap-1 p-3 rounded-xl border text-xs font-bold transition-colors"
          [class.border-accent-ui]="currentMethod().value() === PaymentMethodEnum.QrCode"
          [class.bg-bg-muted]="currentMethod().value() === PaymentMethodEnum.QrCode"
          [class.text-accent-ui]="currentMethod().value() === PaymentMethodEnum.QrCode"
          [class.border-border]="currentMethod().value() !== PaymentMethodEnum.QrCode"
          [class.text-text-muted]="currentMethod().value() !== PaymentMethodEnum.QrCode"
        >
          <span class="material-icons text-[24px]">qr_code</span>
          Pago QR
        </button>
      </div>
    </div>

    @if (currentMethod().value() === PaymentMethodEnum.QrCode) {
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between items-center">
          <label class="field-label font-bold uppercase tracking-wide"
            >Últimos 4 dígitos de Tx</label
          >
          <span class="text-[10px] text-text-soft">(Opcional)</span>
        </div>
        <input
          type="text"
          inputmode="numeric"
          placeholder="Ej: 4821"
          class="w-full px-3 py-2.5 text-sm rounded-xl border border-border bg-bg-muted text-text-main font-mono focus:outline-none focus:border-border-strong"
          [formField]="$any(transactionCode)"
        />
      </div>
    }

    <button
      type="button"
      (click)="submitted.emit()"
      [disabled]="!isValid() || currentMethod().value() === null || submitting()"
      class="btn-primary w-full py-3.5 rounded-xl text-center flex items-center justify-center gap-2 disabled:opacity-40 disabled:cursor-not-allowed"
    >
      <span class="material-icons">done_all</span>
      Completar Venta ({{ total() | money: 'symbol' }})
    </button>
  </div>
</div>
